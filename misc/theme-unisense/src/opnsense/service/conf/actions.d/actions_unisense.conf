[trafficmap.flows]
command:/usr/local/opnsense/scripts/unisense/trafficmap.py flows
parameters:
type:script_output
cache_ttl:2

[trafficmap.status]
command:/usr/local/opnsense/scripts/unisense/trafficmap.py status
parameters:
type:script_output

[geoip.update]
command:/usr/local/opnsense/scripts/unisense/trafficmap.py update
parameters:
type:script
message:UniSense: updating the IP-to-country databases
description:UniSense: update IP-to-country databases (Traffic Map)

[trafficmap.history]
command:/usr/local/opnsense/scripts/unisense/trafficmap.py history
parameters:
type:script_output
cache_ttl:5

[trafficmap.sample]
command:/usr/local/opnsense/scripts/unisense/trafficmap.py sample
parameters:
type:script
description:UniSense: record Traffic Map history (every minute)

[trafficmap.reset]
command:/usr/local/opnsense/scripts/unisense/trafficmap.py reset
parameters:
type:script_output

[trafficmap.conns]
command:/usr/local/opnsense/scripts/unisense/trafficmap.py conns
parameters:%s
type:script_output
cache_ttl:2
