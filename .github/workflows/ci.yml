name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build & lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Compiled CSS is up to date
        run: node scripts/build.mjs --check
      - name: Lint stylesheets and scripts (ESLint)
        run: npm run lint
      - name: Plugin checks (PHP syntax, XML, model masks)
        run: sh scripts/check-plugin.sh
      - name: Lint shell scripts
        run: |
          sudo apt-get install -y shellcheck >/dev/null
          shellcheck -s sh install.sh scripts/package.sh scripts/check-plugin.sh tests/test-install.sh tests/test-real-php.sh misc/theme-unisense/src/opnsense/scripts/unisense/heal.sh
      - name: Installer tests
        run: sh tests/test-install.sh
      - name: Traffic Map backend (databases, pf states, rates)
        run: python3 tests/test-trafficmap.py
      - name: Shield backend (lists, pf tables, block log, alerts)
        run: python3 tests/test-shield.py
      - name: Privacy backend (Unbound stats, AdGuard Home)
        run: python3 tests/test-privacy.py
      - name: World map data is current
        run: node scripts/make-worldmap.mjs --check
      - name: Package
        run: sh scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: unisense-dist
          path: dist/

  visual:
    name: Render & test (OPNsense ${{ matrix.core }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        core: ['26.7', '26.1', '25.7']
    steps:
      - uses: actions/checkout@v7
      - name: Fetch OPNsense core ${{ matrix.core }}
        run: |
          git clone -q --depth 1 --branch "stable/${{ matrix.core }}" --filter=blob:none --sparse \
            https://github.com/opnsense/core "$RUNNER_TEMP/core"
          git -C "$RUNNER_TEMP/core" sparse-checkout set --no-cone \
            '/src/opnsense/www/' '/src/opnsense/mvc/' '/src/etc/' '/src/www/*.inc'
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: phalcon5, simplexml, dom, json, gettext
          tools: none
          coverage: none
      - name: Installer PHP steps for real (settheme, migrations, models, Shield firewall rules)
        run: sudo env "PATH=$PATH" sh tests/test-real-php.sh "$RUNNER_TEMP/core"
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test tools
        run: |
          pip install -r tests/harness/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Render pages
        working-directory: tests/harness
        run: python render.py --core "$RUNNER_TEMP/core"
      - name: Screenshots (fails on JS errors / missing files)
        working-directory: tests/harness
        run: python shoot.py --core "$RUNNER_TEMP/core" --extra collapsed,dialog,appearance
      - name: Interaction checks
        working-directory: tests/harness
        run: python interact.py --core "$RUNNER_TEMP/core"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-${{ matrix.core }}
          path: tests/harness/shots/

  release:
    # Publishes v<VERSION> once: on the first push to main (or a v* tag) whose
    # VERSION has no release yet. Bump VERSION to ship a new release.
    name: Release
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [build, visual]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: unisense-dist
          path: dist
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="$(cat misc/theme-unisense/src/opnsense/www/themes/unisense/VERSION)"
          tag="v$v"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "$tag" ]; then
            echo "::error::VERSION ($v) does not match tag (${GITHUB_REF_NAME})"; exit 1
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists — nothing to do (bump VERSION to publish a new one)"
            exit 0
          fi
          tar -tzf dist/unisense.tar.gz | grep -q '^unisense/opnsense/www/themes/unisense/build/css/main.css$'
          tar -tzf dist/unisense.tar.gz | grep -q '^unisense/install.sh$'
          notes=".github/release-notes/${v}.md"
          [ -f "$notes" ] || notes=/dev/null
          gh release create "$tag" dist/unisense.tar.gz dist/install.sh dist/SHA256SUMS \
            --target "$GITHUB_SHA" --title "UniSense $v" --notes-file "$notes" --latest
          echo "Published $tag"
